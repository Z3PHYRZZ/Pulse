name: Linux build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            pkg-config

      - name: Install frontend
        run: npm ci

      - name: Check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pulse-linux-x64-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
