# Pulse 2.0.0 default configuration. Copy to %APPDATA%\Pulse\config.toml and edit.
refresh_ms = 1000
history_seconds = 180
max_process_rows = 300
process_sort = "cpu"
start_minimized = false
minimize_to_tray = true
enable_startup = false
theme = "dark"

# The close button always exits. Hide to tray uses this preference.

