<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse — overview</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-theme="dark">
  <div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">pulse<span class="scribble">_</span></div>
        <div class="brand-note">native windows monitor<br />rough draft, still running</div>
      </div>
      <nav id="nav" aria-label="Sections">
<button class="nav-button selected" data-nav="overview" type="button">overview</button>
<button class="nav-button" data-nav="cpu" type="button">cpu</button>
<button class="nav-button" data-nav="memory" type="button">memory</button>
<button class="nav-button" data-nav="gpu" type="button">gpu</button>
<button class="nav-button" data-nav="storage" type="button">storage</button>
<button class="nav-button" data-nav="network" type="button">network</button>
<button class="nav-button" data-nav="processes" type="button">processes</button>
<button class="nav-button" data-nav="settings" type="button">settings</button>
</nav>
      <div class="sidebar-foot">
        <div class="tiny-readout" id="tiny-readout">cpu -- · ram --</div>
        <div class="scratch-note" id="status">waiting for first sample</div>
        <div class="theme-row" role="group" aria-label="Theme">
          <button class="raw-button" data-theme-button="dark" type="button">dark</button>
          <button class="raw-button" data-theme-button="light" type="button">light</button>
        </div>
        <button class="raw-button wide" id="hide" type="button">hide to tray ↘</button>
        <button class="raw-button wide" id="exit" type="button">exit ×</button>
      </div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="page-title" id="page-title">overview</div>
        <div class="topbar-meta" id="topbar-meta">starting... • <span id="clock">--:--:--</span></div>
      </header>
      <div id="view" class="view" aria-live="polite">
<div class="section-head">overview</div>
<article class="raw-card boot-card">
<div class="card-label">collectors warming up...</div>
<div class="card-value">rough draft, still running</div>
<div class="boot-list">
<span>cpu — waiting</span>
<span>memory — waiting</span>
<span>gpu — waiting</span>
<span>disk — waiting</span>
<span>network — waiting</span>
</div>
</article>
</div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
